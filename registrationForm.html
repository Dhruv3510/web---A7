<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

</head>
<body>
    <h2>Registration Form</h2>
    <div id="box">
        <form action="login.html" method="get">
            <div>
                <lable>Your Name : </lable>
                <input type="text" placeholder="Enter your name"/>
            </div>
            <br>
            <div>
                <label>Your Email : </label>
                <input type="email" placeholder="Enter your email"/>
            </div>
            <br>
            <div>
                <label>Your Phone no. : </label>
                <input type="tel" placeholder="Enter your phone number"/>
            </div>
            <br>
            <div>
                <label>Your DOB : </label>
                <input type="date"/>
            </div>
            <br>
            <div>
                <label>Your Gender : </label>
                <input type="radio" name="gender" value="male"/>
                <label>Male</label>
                <input type="radio" name="gender" value="female"/>
                <label>Female</label>
                <input type="radio" name="gender" value="other"/>
                <label>Others</label>
            </div>
            <br>
            <div>
                <label>Your Course:</label>
                <input type="checkbox" name="course" value="html"/>
                <label>HTML</label>
                <input type="checkbox" name="course" value="css"/>
                <label>CSS</label>
                <input type="checkbox" name="course" value="javascript"/>
                <label>JavaScript</label>
            </div>
            <br>
            <div>
                <label>Your Country:</label>
                <select>
                    <option value="india">India</option>
                    <option value="usa">USA</option>
                    <option value="uk">UK</option>
                    <option value="australia">Australia</option>
                </select>
            </div>
            <br>
            <div>
                <label>Your Address:</label>
                <textarea placeholder="
                Enter your address" cols="20" rows="5"></textarea>
            </div>
            <br>
            <div>
                <input type="submit" value="Submit" />

                <input type="reset" value="Reset"/>
            </div>
        </form>
</body>
</html>
