<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html{
            margin : 0;
            padding: 0;
        }
        body{
            background-color: aliceblue;

        }
        main{
            width: 960px;
            height: auto;
            background-color: rgb(145, 138, 130);
            margin: 0 auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;

        }
        header{
            width: 960px;
            height: 100px;
            background-color: #ccc ;
        }
        nav{
            width: 960px;
            height: 100px;
            background-color: #ccc;

        }
        section{
            width: 960px;
            height: 400px;
            display: flex;
            flex-direction: row;
            column-gap: 10px;
            
        }
        #left{
            flex-grow: 1 ;
            background-color: #ccc;
        }
        #right{
            flex-grow: 2;
            /* background-color: #ccc; */
            display: flex;
            flex-direction: column;
            
            row-gap:10px;
        }
        aside, article{
            background-color: #CCCC;
            flex-grow: 1;
            gap: 10px;
        }
        footer{
            width: 960px;
            height: 500px;
            background-color: #ccc;
            
        }
    </style>
</head>
<body>
    <main>
        <!--header-->
        <header>
            <h2>Header</h2>
        </header>

        <!-- nav -->
         <nav>
            <h2>Navbar</h2>
         </nav>


        <!-- section -->
         <section>
            <div id="left">

            </div>
            <div id="right">
                <aside>
                    <h2>Aside</h2>
                </aside>

                <article>
                    <h2>Article</h2>
                </article>

            </div>
         </section>


        <!-- footer -->
         <footer>
            <h2>Footer</h2>
         </footer>

    </main>

</body>


</html>
