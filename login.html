<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Page</title>
</head>
<body>

    <h2>Login Form</h2>
    
    <form action="resume.html" method="get">
       
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" minlength="3" maxlength="15" placeholder="3-15 characters" required><br><br>

       
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" minlength="6" maxlength="20" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}" title="Password must be 6-20 characters long and include a number." placeholder="6-20 characters" required><br><br>

        
        <button type="submit">Login</button>
    </form>
    
    

</body>
</html>
