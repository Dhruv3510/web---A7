<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopit Login</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f7f5ef;
            margin: 0;
        }

        header {
            background-color: white;
            padding: 20px;
        }

        .logo {
            color: #285943;
            font-size: 30px;
            font-weight: bold;
        }

        .login {
            background-color: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #dddddd;
            border-radius: 8px;
        }

        h2 {
            color: #285943;
            text-align: center;
        }

        input {
            width: 95%;
            padding: 8px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        button {
            background-color: #285943;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
        }

        a {
            color: #285943;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Shopit</div>
    </header>

    <div class="login">

        <h2>Login</h2>

        <form action="Shopit.html" method="get">

            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email" required>

            <br>

            <label>Password:</label><br>
            <input type="password" placeholder="Enter your password"
                   required>

            <br>

            <button type="submit">Login</button>

        </form>

        <p>
            <a href="Shopit.html">Back to Home</a>
        </p>

    </div>

</body>
</html>
